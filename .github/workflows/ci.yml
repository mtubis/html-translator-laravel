name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Pint, Rector, PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer pint
      - run: composer rector
      - run: composer stan

  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['13.*']
        dependencies: [highest]
        include:
          - php: '8.4'
            laravel: '13.*'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Pin Laravel version
        run: composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: composer test

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Infection (changed lines on PRs, everything on main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            vendor/bin/infection --threads=max --git-diff-lines --git-diff-base="origin/${{ github.base_ref }}" --logger-github --ignore-msi-with-no-mutations
          else
            vendor/bin/infection --threads=max --logger-github
          fi
